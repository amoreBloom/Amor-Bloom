<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amoré Bloom — Pre-order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  :root{
    --cream:#FAF5EF;
    --ink:#211D22;
    --blush:#E7B8C4;
    --stamp:#B33B32;
    --sage:#7C8B6E;
    --gold:#B08D57;
    --line: rgba(33,29,34,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:48px 24px 80px;
    position:relative;
    overflow:hidden;
  }
  .petals{
    position:absolute;
    top:0; left:0; right:0;
    height:220px;
    pointer-events:none;
    z-index:0;
  }
  .petal{
    position:absolute;
    width:14px; height:14px;
    background:var(--blush);
    border-radius:0 60% 0 60%;
    opacity:0.55;
    animation:fall 9s linear infinite;
  }
  @keyframes fall{
    0%{ transform: translateY(-40px) rotate(0deg); opacity:0.7;}
    100%{ transform: translateY(260px) rotate(200deg); opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .petal{ animation:none; display:none; }
  }
  header{
    position:relative;
    z-index:1;
    text-align:center;
    margin-bottom:40px;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--sage);
    margin-bottom:14px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:44px;
    letter-spacing:0.03em;
    margin:0 0 6px;
  }
  .tagline{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:19px;
    color:#5b5560;
    margin:0;
  }
  .koi-divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:22px 0 0;
    color:var(--gold);
  }
  .koi-divider svg{ width:26px; height:26px; }
  .koi-divider .rule{
    height:1px; width:60px; background:var(--line);
  }

  form{
    position:relative;
    z-index:1;
    background:#fff;
    border:1px solid var(--line);
    border-radius:18px;
    padding:32px 26px;
    box-shadow:0 30px 60px -30px rgba(33,29,34,0.25);
  }
  fieldset{
    border:none;
    padding:0;
    margin:0 0 28px;
  }
  fieldset:last-of-type{ margin-bottom:0; }
  legend{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--stamp);
    padding:0 0 12px;
    width:100%;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  .field{
    margin-bottom:16px;
  }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:13px;
    font-weight:500;
    margin-bottom:6px;
    color:#413c45;
  }
  input, select, textarea{
    width:100%;
    padding:12px 14px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#FCFAF7;
    color:var(--ink);
    appearance:none;
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
    background:#fff;
  }
  textarea{ resize:vertical; min-height:70px; }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .row3{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:12px;
  }
  button{
    width:100%;
    padding:16px;
    margin-top:6px;
    background:var(--stamp);
    color:#fff;
    border:none;
    border-radius:10px;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  button:hover{ background:#9c322a; }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:0.6; cursor:not-allowed; }

  .status{
    margin-top:16px;
    text-align:center;
    font-size:14px;
    min-height:20px;
  }
  .status.ok{ color:var(--sage); }
  .status.err{ color:var(--stamp); }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:28px;
    font-size:12px;
    color:#8a8390;
    letter-spacing:0.05em;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="petals" aria-hidden="true">
    <div class="petal" style="left:8%; animation-delay:0s;"></div>
    <div class="petal" style="left:28%; animation-delay:2.5s;"></div>
    <div class="petal" style="left:52%; animation-delay:1.2s;"></div>
    <div class="petal" style="left:74%; animation-delay:4s;"></div>
    <div class="petal" style="left:90%; animation-delay:3.1s;"></div>
  </div>

  <header>
    <div class="eyebrow">Est. 2025</div>
    <h1>AMORÉ BLOOM</h1>
    <p class="tagline">Bloom with Grace</p>
    <div class="koi-divider">
      <div class="rule"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M3 12c3-5 8-7 12-5 2 1 3 3 5 3-1 2-3 3-5 3-4 2-9 0-12-5-1-2 0 2 0 4"/>
        <circle cx="7" cy="10.5" r="0.6" fill="currentColor" stroke="none"/>
      </svg>
      <div class="rule"></div>
    </div>
  </header>

  <form id="preorderForm">
    <fieldset>
      <legend>Contactgegevens</legend>
      <div class="field">
        <label for="from_name">Volledige naam</label>
        <input type="text" id="from_name" name="from_name" required>
      </div>
      <div class="field">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="phone">Telefoonnummer</label>
        <input type="tel" id="phone" name="phone" placeholder="06 12345678" required>
      </div>
    </fieldset>

    <fieldset>
      <legend>Bezorgadres</legend>
      <div class="row3 field">
        <div>
          <label for="street">Straat</label>
          <input type="text" id="street" name="street" required>
        </div>
        <div>
          <label for="housenumber">Nr.</label>
          <input type="text" id="housenumber" name="housenumber" required>
        </div>
      </div>
      <div class="row2 field">
        <div>
          <label for="postcode">Postcode</label>
          <input type="text" id="postcode" name="postcode" required>
        </div>
        <div>
          <label for="city">Stad</label>
          <input type="text" id="city" name="city" required>
        </div>
      </div>
      <div class="field">
        <label for="country">Land</label>
        <input type="text" id="country" name="country" value="Nederland" required>
      </div>
    </fieldset>

    <fieldset>
      <legend>Bestelling</legend>
      <div class="row2 field">
        <div>
          <label for="maat">Maat</label>
          <select id="maat" name="maat" required>
            <option value="">Kies maat</option>
            <option>XS</option>
            <option>S</option>
            <option>M</option>
            <option>L</option>
            <option>XL</option>
            <option>XXL</option>
          </select>
        </div>
        <div>
          <label for="aantal">Aantal</label>
          <input type="number" id="aantal" name="aantal" min="1" value="1" required>
        </div>
      </div>
      <div class="field">
        <label for="opmerking">Opmerking (optioneel)</label>
        <textarea id="opmerking" name="opmerking" placeholder="Bijv. bezorginstructies"></textarea>
      </div>
    </fieldset>

    <button type="submit" id="submitBtn">Pre-order plaatsen</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <footer>Amoré Bloom · beperkt tot 30 pre-orders</footer>
</div>

<script>
  // TODO: vul je EmailJS Public Key en Template ID hier in
  const EMAILJS_PUBLIC_KEY = "YOUR_PUBLIC_KEY";
  const EMAILJS_SERVICE_ID = "service_ua33iir";
  const EMAILJS_TEMPLATE_ID = "YOUR_TEMPLATE_ID";

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  const form = document.getElementById("preorderForm");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("submitBtn");

  form.addEventListener("submit", function(e){
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Versturen...";
    statusEl.textContent = "";
    statusEl.className = "status";

    emailjs.sendForm(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, form)
      .then(() => {
        statusEl.textContent = "Bedankt! Je pre-order is verstuurd.";
        statusEl.className = "status ok";
        form.reset();
        document.getElementById("country").value = "Nederland";
        document.getElementById("aantal").value = 1;
        btn.textContent = "Pre-order plaatsen";
        btn.disabled = false;
      })
      .catch((err) => {
        statusEl.textContent = "Er ging iets mis. Probeer het opnieuw.";
        statusEl.className = "status err";
        btn.textContent = "Pre-order plaatsen";
        btn.disabled = false;
        console.error(err);
      });
  });
</script>
</body>
</html>
